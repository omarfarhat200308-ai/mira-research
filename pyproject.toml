[project]
name = "mira"
version = "0.2.1"
description = "MIRA: a Verifiable Workflow Automator for WhatsApp clinical triage in rural India"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "twilio>=9.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mira*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
